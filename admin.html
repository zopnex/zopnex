<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Zopnex Admin Panel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{--ink:#172033;--muted:#667085;--line:#e5e9f2;--soft:#f6f8fb;--brand:#0f766e;--gold:#f59e0b;--danger:#dc2626;--ok:#16a34a;--card:#fff;--shadow:0 18px 50px rgba(17,24,39,.09)}
    *{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Arial,sans-serif;color:var(--ink);background:var(--soft)}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}img{max-width:100%;display:block}.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#ecfdf5,#fff7ed)}.login-card{width:min(430px,100%);background:#fff;border:1px solid var(--line);border-radius:22px;padding:28px;box-shadow:var(--shadow)}.brand{display:flex;align-items:center;gap:12px;margin-bottom:22px}.logo{width:46px;height:46px;border-radius:13px;background:linear-gradient(135deg,var(--brand),#14b8a6);color:#fff;display:grid;place-items:center;font-weight:900}.brand h1{margin:0;font-size:23px}.muted{color:var(--muted)}label{display:block;font-size:13px;font-weight:800;margin:12px 0 6px}.field{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff;outline:0}textarea.field{min-height:90px;resize:vertical}.btn{background:var(--brand);color:#fff;border-radius:999px;padding:12px 18px;font-weight:800}.btn.alt{background:#111827}.btn.warn{background:var(--gold);color:#111}.btn.danger{background:var(--danger)}.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}.app{display:none;min-height:100vh}.side{position:fixed;inset:0 auto 0 0;width:260px;background:#0b1220;color:#fff;padding:18px;z-index:10}.side .brand{margin-bottom:18px}.side .muted{color:#aab4c8}.nav{display:grid;gap:8px}.nav button{background:transparent;color:#dbe4f0;text-align:left;border-radius:12px;padding:12px;font-weight:800}.nav button.active,.nav button:hover{background:rgba(255,255,255,.1);color:#fff}.main{margin-left:260px;min-height:100vh}.topbar{position:sticky;top:0;background:rgba(246,248,251,.9);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:14px 22px;z-index:5;display:flex;justify-content:space-between;align-items:center}.content{padding:22px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.stat{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 8px 22px rgba(17,24,39,.04)}.stat span{color:var(--muted);font-size:13px;font-weight:700}.stat b{display:block;font-size:25px;margin-top:8px}.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 8px 22px rgba(17,24,39,.04);margin-top:18px}.panel-head{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:14px}.panel-head h2{margin:0}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:850px}.table th,.table td{text-align:left;padding:12px;border-bottom:1px solid var(--line);vertical-align:top}.table th{font-size:12px;text-transform:uppercase;color:var(--muted);background:#fafbfc}.badge{display:inline-flex;border-radius:999px;padding:5px 9px;font-size:12px;font-weight:900;background:#eef2ff;color:#3730a3}.badge.ok{background:#dcfce7;color:#166534}.badge.bad{background:#fee2e2;color:#991b1b}.badge.warn{background:#fef3c7;color:#92400e}.actions{display:flex;gap:7px;flex-wrap:wrap}.mini{padding:8px 10px;border-radius:10px;font-size:12px}.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.formgrid .full{grid-column:1/-1}.modal{position:fixed;inset:0;background:rgba(15,23,42,.48);z-index:30;display:none}.modal.open{display:block}.modal-card{width:min(920px,94vw);max-height:90vh;overflow:auto;background:#fff;border-radius:22px;margin:5vh auto;padding:20px;box-shadow:var(--shadow)}.modal-head{display:flex;justify-content:space-between;gap:12px;align-items:center;border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:14px}.x{width:38px;height:38px;border-radius:999px;background:var(--soft);font-weight:900}.thumb{width:64px;height:64px;object-fit:cover;border-radius:12px;background:var(--soft)}.hidden{display:none!important}.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);opacity:0;background:#111827;color:#fff;padding:12px 16px;border-radius:999px;z-index:80;transition:.2s;font-weight:800}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}.print-area{display:none}.searchbar{display:flex;gap:10px;flex-wrap:wrap}.searchbar .field{max-width:280px}.help{background:#fffbeb;border:1px solid #fde68a;color:#78350f;border-radius:14px;padding:12px;line-height:1.6;font-size:13px;margin-top:14px}.support-app{display:grid;grid-template-columns:360px minmax(0,1fr);height:calc(100vh - 168px);min-height:560px;border:1px solid var(--line);border-radius:18px;overflow:hidden;background:#fff}.ticket-list{border-right:1px solid var(--line);overflow:auto;background:#f8fafc}.ticket-row{width:100%;background:#fff;border-bottom:1px solid var(--line);padding:14px 16px;text-align:left}.ticket-row.active{background:#ecfdf5;border-left:4px solid var(--brand);padding-left:12px}.ticket-row:hover{background:#f0fdf4}.ticket-title{display:flex;justify-content:space-between;gap:8px;align-items:center;font-weight:900}.ticket-title span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ticket-sub{font-size:12px;color:var(--muted);margin-top:4px}.ticket-time{font-size:11px;color:var(--muted);font-weight:700;white-space:nowrap}.ticket-preview{color:var(--ink);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:8px}.ticket-code{color:var(--muted);font-size:11px;margin-top:7px}.chat-panel{display:flex;min-width:0;min-height:0;flex-direction:column;background:#f7fbff;overflow:hidden}.chat-head{min-height:78px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;flex:0 0 auto}.chat-head-title{min-width:0}.chat-head-title b{display:block;font-size:17px}.chat-head-title .muted{font-size:12px;line-height:1.5}.chat-messages{flex:1 1 auto;min-height:0;overflow:auto;padding:22px;background-image:radial-gradient(circle at 1px 1px,#e4eefb 1px,transparent 0);background-size:16px 16px}.chat-bubble{max-width:70%;padding:12px 14px;border-radius:14px;margin:10px 0;background:#fff;box-shadow:0 1px 4px rgba(15,23,42,.08);line-height:1.45}.chat-bubble.admin{margin-left:auto;background:#dcfce7}.chat-meta{display:block;color:var(--muted);font-size:11px;margin-top:6px}.chat-reply{display:grid;grid-template-columns:1fr auto auto;gap:10px;padding:12px;background:#fff;border-top:1px solid var(--line);flex:0 0 auto}.chat-reply textarea{min-height:46px;max-height:120px;resize:vertical}.empty-chat{display:grid;place-items:center;height:100%;color:var(--muted);padding:24px;text-align:center}
    @media(max-width:980px){.side{position:static;width:100%;height:auto}.main{margin-left:0}.nav{grid-template-columns:repeat(3,1fr)}.grid{grid-template-columns:repeat(2,1fr)}.topbar{position:static}.formgrid{grid-template-columns:1fr}.support-app{grid-template-columns:1fr;height:auto}.ticket-list{max-height:280px;border-right:0;border-bottom:1px solid var(--line)}.chat-panel{min-height:520px}.chat-reply{grid-template-columns:1fr}}
    @media(max-width:560px){.content{padding:14px}.grid{grid-template-columns:1fr}.nav{grid-template-columns:1fr 1fr}.panel-head{display:block}.searchbar .field{max-width:none}.actions .btn{width:100%}}
    @media print{body *{visibility:hidden}.print-area,.print-area *{visibility:visible}.print-area{display:block;position:absolute;inset:0;background:#fff;padding:28px}.no-print{display:none!important}.print-table{width:100%;border-collapse:collapse}.print-table th,.print-table td{border:1px solid #ddd;padding:8px;text-align:left}}
  </style>
  <style>
    .order-filters{display:flex;gap:8px;overflow:auto;padding:4px 0 12px}.filter-pill{background:#fff;border:1px solid var(--line);border-radius:999px;padding:9px 13px;font-weight:900;white-space:nowrap;color:var(--ink)}.filter-pill.active{background:var(--brand);border-color:var(--brand);color:#fff}.order-items{display:grid;gap:8px;min-width:230px}.order-item{display:grid;grid-template-columns:48px 1fr;gap:10px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px;text-align:left;width:100%}.order-item:hover{border-color:var(--brand);background:#f0fdfa}.order-item img{width:48px;height:48px;border-radius:10px;object-fit:cover;background:var(--soft)}.order-item b{display:block;font-size:13px;line-height:1.25}.order-item small{color:var(--muted);font-weight:700}.item-detail{display:grid;grid-template-columns:220px 1fr;gap:18px;align-items:start}.item-detail img{width:220px;aspect-ratio:1/1;object-fit:cover;border-radius:16px;background:var(--soft);border:1px solid var(--line)}.pending-box{background:#fff7ed;border:1px solid #fed7aa;border-radius:16px;padding:16px;margin-bottom:16px;display:flex;justify-content:space-between;gap:12px;align-items:center}.pending-box b{font-size:20px}.order-full{display:grid;grid-template-columns:1.3fr .8fr;gap:16px}.order-full-card{border:1px solid var(--line);border-radius:16px;padding:16px;background:#fff}.order-full-item{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;border-bottom:1px solid var(--line);padding:10px 0}.order-full-item img{width:64px;height:64px;border-radius:12px;object-fit:cover}@media(max-width:700px){.item-detail,.order-full{grid-template-columns:1fr}.item-detail img{width:100%}}
  </style>
</head>
<body>
  <section class="login" id="loginView">
    <form class="login-card" id="loginForm">
      <div class="brand"><div class="logo">Z</div><div><h1>Zopnex Admin Panel</h1><div class="muted">Secure admin login</div></div></div>
      <label>Email</label><input class="field" type="email" id="email" required>
      <label>Password</label><input class="field" type="password" id="password" required>
      <button class="btn" style="width:100%;margin-top:18px">Login</button>
      <p class="muted" id="loginError"></p>
    </form>
  </section>

  <section class="app" id="appView">
    <aside class="side">
      <div class="brand"><div class="logo">Z</div><div><h1>Zopnex</h1><div class="muted">Admin Dashboard</div></div></div>
      <div class="nav" id="nav">
        <button class="active" data-tab="dashboard">Dashboard</button><button data-tab="products">Products</button><button data-tab="categories">Categories</button><button data-tab="banners">Banners</button><button data-tab="orders">Orders</button><button data-tab="returns">Returns</button><button data-tab="logs">Logs</button><button data-tab="support">Support</button><button data-tab="settings">Settings</button><button data-tab="coupons">Coupons</button>
      </div>
    </aside>
    <main class="main">
      <div class="topbar"><div><b id="pageTitle">Dashboard</b><div class="muted" id="adminEmail"></div></div><button class="btn ghost" id="logoutBtn">Logout</button></div>
      <div class="content">
        <section id="dashboard" class="tab"></section>
        <section id="products" class="tab hidden"></section>
        <section id="categories" class="tab hidden"></section>
        <section id="banners" class="tab hidden"></section>
        <section id="orders" class="tab hidden"></section>
        <section id="returns" class="tab hidden"></section>
        <section id="logs" class="tab hidden"></section>
        <section id="support" class="tab hidden"></section>
        <section id="settings" class="tab hidden"></section>
        <section id="coupons" class="tab hidden"></section>
      </div>
    </main>
  </section>

  <div class="modal" id="modal"><div class="modal-card"><div class="modal-head"><h2 id="modalTitle">Form</h2><button class="x" onclick="closeModal()">X</button></div><div id="modalBody"></div></div></div>
  <div class="toast" id="toast"></div>
  <div class="print-area" id="printArea"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
    import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
    import { getFirestore, collection, doc, getDoc, getDocs, addDoc, updateDoc, setDoc, deleteDoc, query, orderBy, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

    const firebaseConfig = { apiKey:"AIzaSyCQp2a58mQ9GxlAJG0abWrrF61ZTM9eUsY", authDomain:"zopnex-ts.firebaseapp.com", projectId:"zopnex-ts", storageBucket:"zopnex-ts.firebasestorage.app", messagingSenderId:"791998673086", appId:"1:791998673086:web:75801673b73f0c1b4deeef", measurementId:"G-2PP8T8VR6X" };
    const CLOUDINARY_API = "https://api.cloudinary.com/v1_1/dsnuatuc8/image/upload";
    const CLOUDINARY_UPLOAD_PRESET = "ml_default";
    const app = initializeApp(firebaseConfig), auth=getAuth(app), db=getFirestore(app);
    const INR = new Intl.NumberFormat("en-IN",{style:"currency",currency:"INR",maximumFractionDigits:0});
    const state={products:[],categories:[],banners:[],orders:[],supportChats:[],coupons:[],returnRequests:[],adminLogs:[],settings:{storeName:"Zopnex",deliveryCharge:60,freeDeliveryAbove:999,codEnabled:true,announcement:"Shop Smart. Delivered Easy."}, tab:"dashboard", productSearch:"", orderSearch:"", orderFilter:"all", supportUnsub:null};
    const $=id=>document.getElementById(id), money=n=>INR.format(Number(n||0));
    function toast(msg){ $("toast").textContent=msg; $("toast").classList.add("show"); setTimeout(()=>$("toast").classList.remove("show"),2200); }
    function closeModal(){ $("modal").classList.remove("open"); $("modalBody").innerHTML=""; } window.closeModal=closeModal;
    function badge(v){ const s=String(v||"").toLowerCase(); const cls=s.includes("paid")||s.includes("delivered")||s.includes("active")?"ok":s.includes("cancel")||s.includes("failed")||s.includes("rto")||s.includes("returned")?"bad":"warn"; return `<span class="badge ${cls}">${v||"-"}</span>`; }
    async function uploadCloudinary(file){ if(!file) return ""; const fd=new FormData(); fd.append("file",file); fd.append("upload_preset",CLOUDINARY_UPLOAD_PRESET); const res=await fetch(CLOUDINARY_API,{method:"POST",body:fd}); if(!res.ok) throw new Error("Cloudinary upload failed"); const json=await res.json(); return json.secure_url; }
    function val(form,name){ return new FormData(form).get(name); }
    function bool(form,name){ return new FormData(form).get(name)==="on"; }
    function optionText(v){ return Array.isArray(v) ? v.join(", ") : String(v||""); }
    function variantTextFromItem(i){ return i.variantText || Object.entries(i.variant||{}).map(([k,v])=>`${k}: ${v}`).join(", "); }
    async function logAdminAction(action, targetId, details={}){
      await addDoc(collection(db,"adminLogs"),{action,targetId,details,adminEmail:auth.currentUser?.email||"",createdAt:serverTimestamp()}).catch(err=>console.warn("Admin log skipped",err));
    }
    async function readColl(name){ const snap=await getDocs(query(collection(db,name),orderBy("createdAt","desc"))).catch(()=>getDocs(collection(db,name))); return snap.docs.map(d=>({id:d.id,...d.data()})); }
    async function loadData(){ try{ const [p,c,b,o,ch,cp,rr,lg,ss]=await Promise.all([readColl("products"),readColl("categories"),readColl("banners"),readColl("orders"),readColl("supportChats"),readColl("coupons"),readColl("returnRequests").catch(()=>[]),readColl("adminLogs").catch(()=>[]),getDoc(doc(db,"settings","store"))]); state.products=p; state.categories=c; state.banners=b; state.orders=o; state.supportChats=ch; state.coupons=cp; state.returnRequests=rr; state.adminLogs=lg; if(ss.exists()) state.settings={...state.settings,...ss.data()}; renderAll(); }catch(e){ console.error(e); toast("Data load failed. Firestore rules/admin access check karein."); } }

    function startSupportLive(){
      if(state.supportUnsub) state.supportUnsub();
      state.supportUnsub=onSnapshot(collection(db,"supportChats"),snap=>{
        state.supportChats=snap.docs.map(d=>({id:d.id,...d.data()}));
        if(state.tab==="support") renderSupport();
        else renderDashboard();
      },err=>console.warn("Admin support live skipped",err));
    }
    onAuthStateChanged(auth,user=>{ if(user){ $("loginView").style.display="none"; $("appView").style.display="block"; $("adminEmail").textContent=user.email; loadData().then(startSupportLive); } else { if(state.supportUnsub){ state.supportUnsub(); state.supportUnsub=null; } $("loginView").style.display="grid"; $("appView").style.display="none"; } });
    $("loginForm").onsubmit=async e=>{ e.preventDefault(); $("loginError").textContent=""; try{ await signInWithEmailAndPassword(auth,$("email").value,$("password").value); }catch(err){ $("loginError").textContent=err.message; } };
    $("logoutBtn").onclick=()=>signOut(auth);
    $("nav").onclick=e=>{ if(e.target.dataset.tab){ state.tab=e.target.dataset.tab; document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("active",b.dataset.tab===state.tab)); document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("hidden",t.id!==state.tab)); $("pageTitle").textContent=e.target.textContent; renderAll(); } };

    function renderAll(){ renderDashboard(); renderProducts(); renderCategories(); renderBanners(); renderOrders(); renderReturns(); renderLogs(); renderSupport(); renderSettings(); renderCoupons(); }
    function renderDashboard(){
      const totalSales=state.orders.filter(o=>o.paymentStatus==="Paid"||o.orderStatus==="Delivered").reduce((s,o)=>s+Number(o.grandTotal||0),0);
      const codPending=state.orders.filter(o=>o.paymentMethod==="COD"&&o.paymentStatus!=="Paid").reduce((s,o)=>s+Number(o.codAmount||o.grandTotal||0),0);
      const codPaid=state.orders.filter(o=>o.paymentMethod==="COD"&&o.paymentStatus==="Paid").reduce((s,o)=>s+Number(o.grandTotal||0),0);
      const upiPending=state.orders.filter(o=>o.paymentMethod==="UPI"&&o.paymentStatus!=="Paid").reduce((s,o)=>s+Number(o.grandTotal||0),0);
      const upiPaid=state.orders.filter(o=>o.paymentMethod==="UPI"&&o.paymentStatus==="Paid").reduce((s,o)=>s+Number(o.grandTotal||0),0);
      const readAt=Number(localStorage.getItem("zopnex_admin_read_at")||0), isNew=x=>(x.createdAt?.seconds||0)>readAt;
      const newOrders=state.orders.filter(o=>["Pending","Placed","Accepted"].includes(o.deliveryStatus||o.orderStatus||"Pending")&&isNew(o)).length;
      const newChats=state.supportChats.filter(c=>c.sender==="customer"&&c.status!=="Closed"&&isNew(c)).length;
      const newReturns=state.returnRequests.filter(r=>(r.status||"Pending")==="Pending"&&isNew(r)).length;
      const lowStock=state.products.filter(p=>p.active!==false && Number(p.stockQty||0)>0 && Number(p.stockQty||0)<=5);
      const stats=[["Total Products",state.products.length],["Active Products",state.products.filter(p=>p.active!==false).length],["Low Stock",lowStock.length],["Out of Stock",state.products.filter(p=>p.stockStatus==="Out of Stock"||Number(p.stockQty||0)<=0).length],["Total Orders",state.orders.length],["Pending Orders",state.orders.filter(o=>(o.deliveryStatus||o.orderStatus)==="Pending"||o.orderStatus==="Placed").length],["Delivered",state.orders.filter(o=>o.deliveryStatus==="Delivered").length],["Cancelled",state.orders.filter(o=>o.deliveryStatus==="Cancelled"||o.orderStatus==="Cancelled").length],["RTO Orders",state.orders.filter(o=>o.deliveryStatus==="RTO").length],["Total Sales",money(totalSales)],["COD Pending",money(codPending)],["COD Paid",money(codPaid)],["UPI Pending",money(upiPending)],["UPI Paid",money(upiPaid)]];
      const pendingTotal=newOrders+newChats+newReturns;
      $("dashboard").innerHTML=`${pendingTotal?`<div class="pending-box"><div><b>${pendingTotal} pending request</b><div class="muted">${newOrders} new orders, ${newChats} customer chats, ${newReturns} return requests</div></div><button class="btn ghost" onclick="markDashboardRead()">Mark as read</button></div>`:""}${lowStock.length?`<div class="pending-box"><div><b>${lowStock.length} low stock alert</b><div class="muted">${lowStock.slice(0,5).map(p=>`${p.name} (${p.stockQty})`).join(", ")}</div></div><button class="btn ghost" onclick="state.tab='products';document.querySelector('[data-tab=products]').click()">View products</button></div>`:""}<div class="grid">${stats.map(s=>`<div class="stat"><span>${s[0]}</span><b>${s[1]}</b></div>`).join("")}</div><div class="help"><b>Security guide:</b> Firebase API key public hoti hai. Firestore rules me products/categories/banners/settings public read, orders public create, aur products/orders/settings update/delete sirf admin UID allow karein. Cloudinary API secret frontend me kabhi add na karein.</div>`;
    }
    window.markDashboardRead=()=>{ localStorage.setItem("zopnex_admin_read_at",String(Math.floor(Date.now()/1000))); renderDashboard(); };
    function renderProducts(){
      const rows=state.products.filter(p=>(p.name||"").toLowerCase().includes(state.productSearch.toLowerCase()));
      $("products").innerHTML=`<div class="panel"><div class="panel-head"><h2>Product Management</h2><div class="searchbar"><input class="field" placeholder="Search products" value="${state.productSearch}" oninput="state.productSearch=this.value;renderProducts()"><button class="btn" onclick="productForm()">Add Product</button></div></div><div class="table-wrap"><table class="table"><thead><tr><th>Image</th><th>Product</th><th>Price</th><th>Stock</th><th>Flags</th><th>Actions</th></tr></thead><tbody>${rows.map(p=>`<tr><td>${p.image?`<img class="thumb" src="${p.image}">`:"-"}</td><td><b>${p.name||"-"}</b><div class="muted">${p.category||"General"} - ${p.sku||"No SKU"}</div><div class="muted">${[p.size&&`Size: ${optionText(p.size)}`,p.color&&`Color: ${optionText(p.color)}`].filter(Boolean).join(" | ")}</div></td><td><b>${money(p.discountPrice||p.price)}</b><div class="muted">Old: ${p.oldPrice?money(p.oldPrice):"-"}</div></td><td>${badge(p.stockStatus||"Available")}<div class="muted">Qty: ${p.stockQty||0}</div><div class="muted">Delivery: ${p.deliveryDays||state.settings.deliveryDays||4} days</div></td><td>${p.featured?badge("Featured"):""} ${p.bestSeller?badge("Best Seller"):""} ${p.active===false?badge("Inactive"):badge("Active")}</td><td><div class="actions"><button class="btn mini ghost" onclick="productForm('${p.id}')">Edit</button><button class="btn mini danger" onclick="removeDoc('products','${p.id}')">Delete</button></div></td></tr>`).join("")||`<tr><td colspan="6">No products yet.</td></tr>`}</tbody></table></div></div>`;
    }

    function renderLogs(){
      const rows=state.adminLogs.slice(0,100);
      $("logs").innerHTML=`<div class="panel"><div class="panel-head"><h2>Admin Activity Logs</h2><button class="btn ghost" onclick="loadData()">Refresh</button></div><div class="table-wrap"><table class="table"><thead><tr><th>Time</th><th>Admin</th><th>Action</th><th>Target</th><th>Details</th></tr></thead><tbody>${rows.map(l=>`<tr><td>${dateText(l.createdAt)}</td><td>${l.adminEmail||"-"}</td><td>${badge(l.action||"-")}</td><td>${l.targetId||"-"}</td><td><pre style="white-space:pre-wrap;margin:0;font:inherit">${JSON.stringify(l.details||{},null,2)}</pre></td></tr>`).join("")||`<tr><td colspan="5">No logs yet.</td></tr>`}</tbody></table></div></div>`;
    }

    function ticketKey(c){ return c.ticketId || `${c.customerUid||c.customerEmail||"guest"}-${c.orderId||"general"}-${c.status==="Closed"?c.id:"open"}`; }
    function supportTickets(){
      const map=new Map();
      state.supportChats.forEach(c=>{
        const key=ticketKey(c), item=map.get(key)||{key,ticketId:c.ticketId||key,messages:[],latest:null,status:"Open"};
        item.messages.push(c);
        item.latest=!item.latest || (c.createdAt?.seconds||0)>(item.latest.createdAt?.seconds||0) ? c : item.latest;
        item.status=item.messages.some(m=>m.status==="Closed")?"Closed":(item.messages.some(m=>m.sender==="customer"&&m.status==="Open")?"Open":"Replied");
        map.set(key,item);
      });
      return [...map.values()].map(t=>({...t,messages:t.messages.sort((a,b)=>(a.createdAt?.seconds||0)-(b.createdAt?.seconds||0))})).sort((a,b)=>(b.latest?.createdAt?.seconds||0)-(a.latest?.createdAt?.seconds||0));
    }
    function renderSupport(){
      const tickets=supportTickets();
      if(!state.activeSupportKey && tickets.length) state.activeSupportKey=tickets[0].key;
      const active=tickets.find(t=>t.key===state.activeSupportKey);
      $("support").innerHTML=`<div class="panel"><div class="panel-head"><div><h2>24x7 Customer Support</h2><div class="muted">Live inbox - ${tickets.length} case${tickets.length===1?"":"s"}</div></div><button class="btn ghost" onclick="loadData()">Refresh</button></div><div class="support-app"><div class="ticket-list">${tickets.map(t=>{ const latest=t.latest||{}, order=latest.orderId||t.orderId||"", preview=`${latest.sender==="admin"?"You: ":latest.sender==="bot"?"Assistant: ":""}${latest.message||"No message yet"}`; return `<button class="ticket-row ${t.key===state.activeSupportKey?"active":""}" onclick="openSupportTicket('${t.key}')"><div class="ticket-title"><span>${latest.customerName||latest.customerEmail||"Customer"}</span>${badge(t.status)}</div><div class="ticket-sub">${order?`Order ${order}`:"General support"}${latest.deliveryStatus||latest.orderStatus?` - ${latest.deliveryStatus||latest.orderStatus}`:""}</div><div class="ticket-preview">${preview}</div><div class="ticket-code">Case ${String(t.ticketId).slice(-5)} ${dateText(latest.createdAt)||""}</div></button>`}).join("")||`<div class="empty-chat">No support tickets yet.</div>`}</div><div class="chat-panel">${active?renderSupportConversation(active):`<div class="empty-chat">Select a support ticket</div>`}</div></div></div>`;
      setTimeout(()=>{ const el=document.getElementById("adminChatMessages"); if(el) el.scrollTop=el.scrollHeight; },20);
    }
    function renderSupportConversation(t){
      const first=t.messages[0]||{}, closed=t.status==="Closed";
      return `<div class="chat-head"><div class="chat-head-title"><b>${first.customerName||"Customer"}</b><div class="muted">Case ${String(t.ticketId).slice(-5)}${first.orderId?` - Order ${first.orderId}`:""}${first.customerEmail?` - ${first.customerEmail}`:""}</div></div><div class="actions">${badge(t.status)}<button class="btn mini ghost" onclick="closeSupportTicket('${t.key}')">Mark Solved</button></div></div><div class="chat-messages" id="adminChatMessages">${t.messages.map(m=>`<div class="chat-bubble ${m.sender==="admin"?"admin":""}"><b>${m.sender==="admin"?"Admin":m.sender==="bot"?"Assistant":"Customer"}</b><div>${m.message||""}</div><span class="chat-meta">${dateText(m.createdAt)}${m.orderStatus||m.deliveryStatus?` - ${m.deliveryStatus||m.orderStatus}`:""}</span></div>`).join("")}</div><form class="chat-reply" onsubmit="replySupportTicket(event,'${t.key}')"><textarea class="field" name="message" placeholder="${closed?"Ticket closed. Reply to reopen.":"Type reply"}" required></textarea><button class="btn">Send</button><button type="button" class="btn ghost" onclick="closeSupportTicket('${t.key}')">Close</button></form>`;
    }
    window.openSupportTicket=(key)=>{ state.activeSupportKey=key; renderSupport(); };
    window.replySupportTicket=async(e,key)=>{ e.preventDefault(); const message=new FormData(e.target).get("message"), t=supportTickets().find(x=>x.key===key); if(!t) return; e.target.reset(); const old=t.latest||{}; await addDoc(collection(db,"supportChats"),{ticketId:t.ticketId,customerUid:old.customerUid||"",customerName:old.customerName||"",customerEmail:old.customerEmail||"",orderId:old.orderId||"",orderStatus:old.orderStatus||"",deliveryStatus:old.deliveryStatus||"",message,sender:"admin",status:"Replied",createdAt:serverTimestamp(),updatedAt:serverTimestamp()}); await Promise.all(t.messages.map(m=>updateDoc(doc(db,"supportChats",m.id),{status:"Replied",updatedAt:serverTimestamp()}).catch(()=>{}))); toast("Reply sent"); };
    window.closeSupportTicket=async(key)=>{ const t=supportTickets().find(x=>x.key===key); if(!t) return; await Promise.all(t.messages.map(m=>updateDoc(doc(db,"supportChats",m.id),{status:"Closed",updatedAt:serverTimestamp()}).catch(()=>{}))); toast("Ticket closed"); };

    function renderSettings(){ const s=state.settings; $("settings").innerHTML=`<div class="panel"><div class="panel-head"><h2>Store Settings</h2></div><form id="settingsForm" class="formgrid"><div><label>Store Name</label><input class="field" name="storeName" value="${s.storeName||""}"></div><div><label>WhatsApp Number</label><input class="field" name="whatsapp" value="${s.whatsapp||""}"></div><div><label>Store Logo URL</label><input class="field" name="logo" value="${s.logo||""}"></div><div><label>Upload Logo</label><input class="field" name="logoFile" type="file" accept="image/*"></div><div><label>UPI ID</label><input class="field" name="upiId" value="${s.upiId||""}"></div><div><label>UPI QR URL</label><input class="field" name="upiQr" value="${s.upiQr||""}"></div><div><label>Upload UPI QR</label><input class="field" name="upiQrFile" type="file" accept="image/*"></div><div><label>Delivery Charge</label><input class="field" type="number" name="deliveryCharge" value="${s.deliveryCharge||0}"></div><div><label>Free Delivery Above</label><input class="field" type="number" name="freeDeliveryAbove" value="${s.freeDeliveryAbove||0}"></div><div><label>Default Delivery Days</label><input class="field" type="number" name="deliveryDays" value="${s.deliveryDays||4}"></div><div><label>Contact Email</label><input class="field" name="contactEmail" value="${s.contactEmail||""}"></div><label class="full"><input type="checkbox" name="codEnabled" ${s.codEnabled!==false?"checked":""}> Enable Cash on Delivery</label><div class="full"><label>Announcement Text</label><input class="field" name="announcement" value="${s.announcement||""}"></div><div class="full"><label>Store Address</label><textarea class="field" name="storeAddress">${s.storeAddress||""}</textarea></div><div class="full"><label>Return Policy</label><textarea class="field" name="returnPolicy">${s.returnPolicy||""}</textarea></div><div class="full"><label>Shipping Policy</label><textarea class="field" name="shippingPolicy">${s.shippingPolicy||""}</textarea></div><div class="full"><label>Privacy Policy</label><textarea class="field" name="privacyPolicy">${s.privacyPolicy||""}</textarea></div><div class="full"><label>About Store</label><textarea class="field" name="aboutStore">${s.aboutStore||""}</textarea></div><button class="btn full">Save Settings</button></form></div>`; $("settingsForm").onsubmit=saveSettings; }
    async function saveSettings(e){ e.preventDefault(); const f=e.target; try{ const logo= f.logoFile.files[0] ? await uploadCloudinary(f.logoFile.files[0]) : val(f,"logo"); const upiQr= f.upiQrFile.files[0] ? await uploadCloudinary(f.upiQrFile.files[0]) : val(f,"upiQr"); const data={storeName:val(f,"storeName"),logo,whatsapp:val(f,"whatsapp"),upiId:val(f,"upiId"),upiQr,deliveryCharge:Number(val(f,"deliveryCharge")||0),freeDeliveryAbove:Number(val(f,"freeDeliveryAbove")||0),deliveryDays:Number(val(f,"deliveryDays")||4),codEnabled:bool(f,"codEnabled"),announcement:val(f,"announcement"),contactEmail:val(f,"contactEmail"),storeAddress:val(f,"storeAddress"),returnPolicy:val(f,"returnPolicy"),shippingPolicy:val(f,"shippingPolicy"),privacyPolicy:val(f,"privacyPolicy"),aboutStore:val(f,"aboutStore"),updatedAt:serverTimestamp()}; await setDoc(doc(db,"settings","store"),data,{merge:true}); toast("Settings saved"); loadData(); }catch(err){ console.error(err); toast("Settings save failed"); } }

    function renderCoupons(){ $("coupons").innerHTML=`<div class="panel"><div class="panel-head"><h2>Coupon System</h2><button class="btn" onclick="couponForm()">Add Coupon</button></div><table class="table"><thead><tr><th>Code</th><th>Discount</th><th>Limits</th><th>Status</th><th>Actions</th></tr></thead><tbody>${state.coupons.map(c=>`<tr><td><b>${c.code}</b></td><td>${c.discountType} ${c.discountValue}</td><td>Min ${money(c.minimumOrder||0)} Max ${c.maximumDiscount?money(c.maximumDiscount):"-"}<div class="muted">Expiry: ${c.expiryDate||"-"}</div></td><td>${c.active===false?badge("Inactive"):badge("Active")}</td><td><div class="actions"><button class="btn mini ghost" onclick="couponForm('${c.id}')">Edit</button><button class="btn mini danger" onclick="removeDoc('coupons','${c.id}')">Delete</button></div></td></tr>`).join("")||`<tr><td colspan="5">Coupon structure ready. No coupons yet.</td></tr>`}</tbody></table></div>`; }
    window.couponForm=(id="")=>{ const c=state.coupons.find(x=>x.id===id)||{discountType:"fixed",active:true}; $("modalTitle").textContent=id?"Edit Coupon":"Add Coupon"; $("modalBody").innerHTML=`<form id="couponForm" class="formgrid"><div><label>Coupon Code</label><input required class="field" name="code" value="${c.code||""}"></div><div><label>Discount Type</label><select class="field" name="discountType"><option value="fixed" ${c.discountType==="fixed"?"selected":""}>Fixed</option><option value="percentage" ${c.discountType==="percentage"?"selected":""}>Percentage</option></select></div><div><label>Discount Value</label><input required class="field" type="number" name="discountValue" value="${c.discountValue||""}"></div><div><label>Minimum Order</label><input class="field" type="number" name="minimumOrder" value="${c.minimumOrder||0}"></div><div><label>Maximum Discount</label><input class="field" type="number" name="maximumDiscount" value="${c.maximumDiscount||""}"></div><div><label>Expiry Date</label><input class="field" type="date" name="expiryDate" value="${c.expiryDate||""}"></div><label class="full"><input type="checkbox" name="active" ${c.active!==false?"checked":""}> Active</label><button class="btn full">Save Coupon</button></form>`; $("modal").classList.add("open"); $("couponForm").onsubmit=async e=>{ e.preventDefault(); const f=e.target; const data={code:val(f,"code").toUpperCase(),discountType:val(f,"discountType"),discountValue:Number(val(f,"discountValue")||0),minimumOrder:Number(val(f,"minimumOrder")||0),maximumDiscount:Number(val(f,"maximumDiscount")||0),active:bool(f,"active"),expiryDate:val(f,"expiryDate"),updatedAt:serverTimestamp()}; id?await updateDoc(doc(db,"coupons",id),data):await addDoc(collection(db,"coupons"),{...data,createdAt:serverTimestamp()}); closeModal(); loadData(); toast("Coupon saved"); }; };

    window.removeDoc=async(coll,id)=>{ if(!confirm("Delete this item?")) return; await deleteDoc(doc(db,coll,id)); toast("Deleted"); loadData(); };
    window.state=state; window.renderProducts=renderProducts; window.renderOrders=renderOrders; window.loadData=loadData;
  </script>
</body>
</html>
