<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zopnex Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root{--ink:#172033;--muted:#677085;--line:#e5e9f2;--soft:#f6f8fb;--brand:#0f766e;--gold:#f59e0b;--danger:#dc2626;--ok:#16a34a;--shadow:0 18px 50px rgba(17,24,39,.09)}
    *{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Arial,sans-serif;color:var(--ink);background:var(--soft)}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}img{max-width:100%;display:block}.hidden{display:none!important}.muted{color:var(--muted)}label{display:block;font-size:13px;font-weight:800;margin:12px 0 6px}.field{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff;outline:0}textarea.field{min-height:90px;resize:vertical}.btn{background:var(--brand);color:#fff;border-radius:999px;padding:12px 18px;font-weight:800}.btn.alt{background:#111827}.btn.warn{background:var(--gold);color:#111}.btn.danger{background:var(--danger)}.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}.mini{padding:8px 10px;border-radius:10px;font-size:12px}.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#ecfdf5,#fff7ed)}.login-card{width:min(430px,100%);background:#fff;border:1px solid var(--line);border-radius:22px;padding:28px;box-shadow:var(--shadow)}.brand{display:flex;align-items:center;gap:12px;margin-bottom:22px}.logo{width:46px;height:46px;border-radius:13px;background:linear-gradient(135deg,var(--brand),#14b8a6);color:#fff;display:grid;place-items:center;font-weight:900}.brand h1{margin:0;font-size:23px}.app{display:none;min-height:100vh}.side{position:fixed;inset:0 auto 0 0;width:260px;background:#0b1220;color:#fff;padding:18px;z-index:10}.side .muted{color:#aab4c8}.nav{display:grid;gap:8px}.nav button{background:transparent;color:#dbe4f0;text-align:left;border-radius:12px;padding:12px;font-weight:800}.nav button.active,.nav button:hover{background:rgba(255,255,255,.1);color:#fff}.main{margin-left:260px;min-height:100vh}.topbar{position:sticky;top:0;background:rgba(246,248,251,.9);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:14px 22px;z-index:5;display:flex;justify-content:space-between;align-items:center}.content{padding:22px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.stat,.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 8px 22px rgba(17,24,39,.04)}.panel{margin-top:18px}.stat span{color:var(--muted);font-size:13px;font-weight:700}.stat b{display:block;font-size:25px;margin-top:8px}.panel-head{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:14px}.panel-head h2{margin:0}.searchbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.searchbar .field{max-width:280px}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:850px}.table th,.table td{text-align:left;padding:12px;border-bottom:1px solid var(--line);vertical-align:top}.table th{font-size:12px;text-transform:uppercase;color:var(--muted);background:#fafbfc}.badge{display:inline-flex;border-radius:999px;padding:5px 9px;font-size:12px;font-weight:900;background:#eef2ff;color:#3730a3}.badge.ok{background:#dcfce7;color:#166534}.badge.bad{background:#fee2e2;color:#991b1b}.badge.warn{background:#fef3c7;color:#92400e}.actions{display:flex;gap:7px;flex-wrap:wrap}.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.formgrid .full{grid-column:1/-1}.modal{position:fixed;inset:0;background:rgba(15,23,42,.48);z-index:30;display:none}.modal.open{display:block}.modal-card{width:min(960px,94vw);max-height:90vh;overflow:auto;background:#fff;border-radius:22px;margin:5vh auto;padding:20px;box-shadow:var(--shadow)}.modal-head{display:flex;justify-content:space-between;gap:12px;align-items:center;border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:14px}.x{width:38px;height:38px;border-radius:999px;background:var(--soft);font-weight:900}.thumb{width:64px;height:64px;object-fit:cover;border-radius:12px;background:var(--soft)}.thumbs-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.thumbs-row img{width:44px;height:44px;border-radius:8px;object-fit:cover;border:1px solid var(--line)}.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);opacity:0;background:#111827;color:#fff;padding:12px 16px;border-radius:999px;z-index:80;transition:.2s;font-weight:800}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}.help{background:#fffbeb;border:1px solid #fde68a;color:#78350f;border-radius:14px;padding:12px;line-height:1.6;font-size:13px;margin-top:14px}.chat-app{display:grid;grid-template-columns:320px 1fr;min-height:560px;border:1px solid var(--line);border-radius:18px;overflow:hidden;background:#fff}.ticket-list{background:#f8fafc;border-right:1px solid var(--line);overflow:auto}.ticket-row{width:100%;background:#fff;border-bottom:1px solid var(--line);padding:14px;text-align:left}.ticket-row.active{background:#ecfdf5;border-left:4px solid var(--brand)}.chat-panel{display:flex;flex-direction:column;min-height:0}.chat-head{padding:14px;border-bottom:1px solid var(--line);background:#fff}.chat-messages{flex:1;overflow:auto;padding:18px;background:#f7fbff}.chat-bubble{max-width:72%;padding:12px 14px;border-radius:14px;margin:10px 0;background:#fff;box-shadow:0 1px 4px rgba(15,23,42,.08)}.chat-bubble.admin{margin-left:auto;background:#dcfce7}.chat-reply{display:grid;grid-template-columns:1fr auto;gap:10px;padding:12px;border-top:1px solid var(--line)}
    .menu-btn{display:none;width:42px;height:42px;border-radius:12px;background:#fff;border:1px solid var(--line);color:var(--ink);font-size:24px;font-weight:900}.side-close{display:none}.mobile-shade{display:none;position:fixed;inset:0;background:rgba(15,23,42,.48);z-index:8}.mobile-shade.open{display:block}
    .badge.placed,.badge.accepted{background:#dbeafe;color:#1d4ed8}.badge.pending,.badge.packed,.badge.verify,.badge.draft{background:#fef3c7;color:#92400e}.badge.shipped,.badge.out-for-delivery{background:#ede9fe;color:#6d28d9}.badge.delivered{background:#dcfce7;color:#166534}.badge.cancelled,.badge.returned,.badge.rto,.badge.inactive{background:#fee2e2;color:#991b1b}.verify-list{display:grid;gap:10px}.verify-row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:14px;padding:12px;background:#fff}
    .banner-upload-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    @media(max-width:900px){.side{position:fixed;inset:0 auto 0 0;width:min(300px,86vw);transform:translateX(-105%);transition:.22s ease;z-index:12;overflow:auto}.side.open{transform:translateX(0)}.side-close{display:grid;position:absolute;right:12px;top:12px;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.12);color:#fff;place-items:center;font-weight:900}.main{margin-left:0}.topbar{padding:10px 12px;gap:10px;justify-content:flex-start}.topbar>div{min-width:0;flex:1}.menu-btn{display:grid;place-items:center;flex:0 0 auto}.content{padding:14px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.stat,.panel{border-radius:14px;padding:14px}.panel-head{align-items:flex-start;flex-direction:column}.searchbar{width:100%;display:grid;grid-template-columns:1fr;gap:8px}.searchbar .field{max-width:none}.formgrid,.banner-upload-grid{grid-template-columns:1fr}.chat-app{grid-template-columns:1fr;min-height:calc(100vh - 190px)}.ticket-list{max-height:230px}.chat-bubble{max-width:88%}.table{min-width:720px}.modal-card{width:100vw;height:100vh;max-height:none;margin:0;border-radius:0}.btn{padding:11px 14px}.actions{gap:6px}}
    @media(max-width:560px){.grid{grid-template-columns:1fr}.topbar .muted{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.stat b{font-size:22px}.table{min-width:680px}.content{padding:10px}.panel{margin-top:12px}.formgrid .panel{margin-top:8px}}
  </style>
</head>
<body>
  <section class="login" id="loginView"><div class="login-card"><div class="brand"><div class="logo">Z</div><div><h1>Zopnex Admin Panel</h1><div class="muted">Secure admin login</div></div></div><form id="loginForm"><label>Email</label><input class="field" id="email" type="email" required><label>Password</label><input class="field" id="password" type="password" required><button class="btn" style="width:100%;margin-top:16px">Login</button><p id="loginError" style="color:var(--danger)"></p></form></div></section>
  <section class="app" id="appView">
    <div class="mobile-shade" id="mobileShade"></div>
    <aside class="side" id="sideNav"><button class="side-close" id="sideClose">X</button><div class="brand"><div class="logo">Z</div><div><h1>Zopnex</h1><div class="muted">Admin Dashboard</div></div></div><nav class="nav" id="nav"><button class="active" data-tab="dashboard">Dashboard</button><button data-tab="products">Products</button><button data-tab="categories">Categories</button><button data-tab="banners">Banners</button><button data-tab="orders">Orders</button><button data-tab="returns">Returns</button><button data-tab="support">Support</button><button data-tab="settings">Settings</button><button data-tab="coupons">Coupons</button></nav></aside>
    <main class="main"><div class="topbar"><button class="menu-btn" id="menuBtn">☰</button><div><b id="pageTitle">Dashboard</b><div class="muted" id="adminEmail"></div></div><button class="btn ghost" id="logoutBtn">Logout</button></div><div class="content"><section id="dashboard" class="tab"></section><section id="products" class="tab hidden"></section><section id="categories" class="tab hidden"></section><section id="banners" class="tab hidden"></section><section id="orders" class="tab hidden"></section><section id="returns" class="tab hidden"></section><section id="support" class="tab hidden"></section><section id="settings" class="tab hidden"></section><section id="coupons" class="tab hidden"></section></div></main>
  </section>
  <div class="modal" id="modal"><div class="modal-card"><div class="modal-head"><h2 id="modalTitle">Edit</h2><button class="x" onclick="closeModal()">X</button></div><div id="modalBody"></div></div></div>
  <div class="toast" id="toast"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
    import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
    import { getFirestore, collection, doc, getDoc, getDocs, addDoc, updateDoc, setDoc, deleteDoc, query, orderBy, where, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

    const firebaseConfig={apiKey:"AIzaSyCQp2a58mQ9GxlAJG0abWrrF61ZTM9eUsY",authDomain:"zopnex-ts.firebaseapp.com",projectId:"zopnex-ts",storageBucket:"zopnex-ts.firebasestorage.app",messagingSenderId:"791998673086",appId:"1:791998673086:web:75801673b73f0c1b4deeef",measurementId:"G-2PP8T8VR6X"};
    const app=initializeApp(firebaseConfig), auth=getAuth(app), db=getFirestore(app);
    const CLOUDINARY_API="https://api.cloudinary.com/v1_1/dsnuatuc8/image/upload", CLOUDINARY_UPLOAD_PRESET="ml_default";
    const INR=new Intl.NumberFormat("en-IN",{style:"currency",currency:"INR",maximumFractionDigits:0});
    const state={products:[],categories:[],banners:[],orders:[],returnRequests:[],supportChats:[],coupons:[],settings:{storeName:"Zopnex",deliveryCharge:60,freeDeliveryAbove:999,codEnabled:true,deliveryDays:4},tab:"dashboard",productSearch:"",orderFilter:"all",orderSearch:"",selectedProducts:new Set(),supportUnsub:null,activeTicket:""};
    const $=id=>document.getElementById(id), money=n=>INR.format(Number(n||0));
    function toast(msg){$("toast").textContent=msg;$("toast").classList.add("show");setTimeout(()=>$("toast").classList.remove("show"),2200)}
    function closeModal(){$("modal").classList.remove("open");$("modalBody").innerHTML=""} window.closeModal=closeModal;
    function val(form,name){return new FormData(form).get(name)||""} function bool(form,name){return new FormData(form).get(name)==="on"}
    function badge(v){const text=v||"-",s=String(text).toLowerCase();let cls=s.replace(/\s+/g,"-");if(s.includes("pending verification"))cls="verify";else if(s.includes("draft")||s.includes("inactive"))cls=s.includes("draft")?"draft":"inactive";else if(s.includes("cancel")||s.includes("reject")||s.includes("fail")||s.includes("out of stock"))cls="bad";else if(s.includes("ship")||s.includes("out for delivery"))cls="shipped";else if(s.includes("deliver"))cls="delivered";else if(s.includes("paid")||s.includes("active")||s.includes("approved"))cls="ok";else if(s.includes("pack"))cls="packed";else if(s.includes("placed")||s.includes("accepted"))cls="placed";else cls="warn";return `<span class="badge ${cls}">${text}</span>`}
    function dateText(ts){try{const d=ts?.toDate?ts.toDate():(ts?new Date(ts):null);return d?d.toLocaleDateString("en-IN",{day:"2-digit",month:"short",year:"numeric"}):""}catch(e){return""}}
    async function uploadCloudinary(file){if(!file)return"";const fd=new FormData();fd.append("file",file);fd.append("upload_preset",CLOUDINARY_UPLOAD_PRESET);const res=await fetch(CLOUDINARY_API,{method:"POST",body:fd});if(!res.ok)throw new Error("Cloudinary upload failed");const json=await res.json();return json.secure_url}
    async function readColl(name){const snap=await getDocs(query(collection(db,name),orderBy("createdAt","desc"))).catch(()=>getDocs(collection(db,name)));return snap.docs.map(d=>({id:d.id,...d.data()}))}
    function optionText(v){return Array.isArray(v)?v.join(", "):String(v||"")}
    function imageOf(p){return p.image||p.mainImage||(Array.isArray(p.images)&&p.images[0])||""}
    function imagesOf(p){return [...new Set([...(Array.isArray(p.images)?p.images:[]),p.mainImage,p.image].filter(Boolean))]}
    function variantTextFromItem(i){return i.variantText||Object.entries(i.variant||{}).map(([k,v])=>`${k}: ${v}`).join(", ")}
    async function logAdminAction(action,targetId,details={}){await addDoc(collection(db,"adminLogs"),{action,targetId,details,adminEmail:auth.currentUser?.email||"",createdAt:serverTimestamp()}).catch(()=>{})}

    async function loadData(){
      try{
        const [p,c,b,o,rr,ch,cp,ss]=await Promise.all([readColl("products"),readColl("categories"),readColl("banners"),readColl("orders"),readColl("returnRequests").catch(()=>[]),readColl("supportChats").catch(()=>[]),readColl("coupons").catch(()=>[]),getDoc(doc(db,"settings","store"))]);
        state.products=p;state.categories=c;state.banners=b;state.orders=o;state.returnRequests=rr;state.supportChats=ch;state.coupons=cp;if(ss.exists())state.settings={...state.settings,...ss.data()};renderAll();
      }catch(err){console.error(err);toast("Data load failed")}
    }
    function renderAll(){renderDashboard();renderProducts();renderCategories();renderBanners();renderOrders();renderReturns();renderSupport();renderSettings();renderCoupons()}
    onAuthStateChanged(auth,user=>{if(user){$("loginView").style.display="none";$("appView").style.display="block";$("adminEmail").textContent=user.email;loadData();startSupportLive()}else{$("loginView").style.display="grid";$("appView").style.display="none";if(state.supportUnsub)state.supportUnsub()}});
    $("loginForm").onsubmit=async e=>{e.preventDefault();$("loginError").textContent="";try{await signInWithEmailAndPassword(auth,$("email").value,$("password").value)}catch(err){$("loginError").textContent=err.message}};
    $("logoutBtn").onclick=()=>signOut(auth);
    function closeAdminMenu(){$("sideNav").classList.remove("open");$("mobileShade").classList.remove("open");document.body.style.overflow=""}
    $("menuBtn").onclick=()=>{$("sideNav").classList.add("open");$("mobileShade").classList.add("open");document.body.style.overflow="hidden"};
    $("sideClose").onclick=closeAdminMenu;$("mobileShade").onclick=closeAdminMenu;
    $("nav").onclick=e=>{if(!e.target.dataset.tab)return;state.tab=e.target.dataset.tab;document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("active",b.dataset.tab===state.tab));document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("hidden",t.id!==state.tab));$("pageTitle").textContent=e.target.textContent;closeAdminMenu();renderAll()};
    window.goTab=tab=>{const b=document.querySelector(`[data-tab="${tab}"]`);if(b)b.click()};

    function renderDashboard(){
      const total=state.orders.filter(o=>o.paymentStatus==="Paid"||o.deliveryStatus==="Delivered").reduce((s,o)=>s+Number(o.grandTotal||0),0);
      const low=state.products.filter(p=>p.active!==false&&Number(p.stockQty||0)>0&&Number(p.stockQty||0)<=5);
      const verify=state.orders.filter(o=>String(o.paymentStatus||"").toLowerCase().includes("pending verification"));
      const stats=[["Total Products",state.products.length],["Active Products",state.products.filter(p=>p.active!==false&&!p.draft).length],["Draft Products",state.products.filter(p=>p.draft||p.active===false).length],["Low Stock",low.length],["Orders",state.orders.length],["Pending Orders",state.orders.filter(o=>!["Delivered","Cancelled","Returned"].includes(o.deliveryStatus||o.orderStatus)).length],["UPI Verify",verify.length],["Total Sales",money(total)]];
      $("dashboard").innerHTML=`<div class="grid">${stats.map(s=>`<div class="stat"><span>${s[0]}</span><b>${s[1]}</b></div>`).join("")}</div>${verify.length?`<div class="panel"><div class="panel-head"><h2>Pending UPI Verification</h2><button class="btn ghost" onclick="showPaymentQueue()">Open Queue</button></div><div class="verify-list">${verify.slice(0,6).map(o=>`<div class="verify-row"><div><b>${o.orderId||o.id}</b><div class="muted">${o.customerName||"-"} - ${money(o.grandTotal)} - UTR: ${o.upiUtr||"-"}</div></div><button class="btn mini" onclick="openOrder('${o.id}')">Check</button></div>`).join("")}</div></div>`:""}${low.length?`<div class="help"><b>Low stock:</b> ${low.slice(0,8).map(p=>`${p.name} (${p.stockQty})`).join(", ")}</div>`:""}<div class="help"><b>Security:</b> Firebase rules me admin UID ke bina products/orders/settings update/delete block rakhein.</div>`;
    }
    window.showPaymentQueue=()=>{state.orderFilter="verify";goTab("orders")};

    function renderProducts(){
      const rows=state.products.filter(p=>(p.name||"").toLowerCase().includes(state.productSearch.toLowerCase()));
      const selected=[...state.selectedProducts].filter(id=>state.products.some(p=>p.id===id));state.selectedProducts=new Set(selected);
      $("products").innerHTML=`<div class="panel"><div class="panel-head"><h2>Product Management</h2><div class="searchbar"><input class="field" placeholder="Search products" value="${state.productSearch}" oninput="state.productSearch=this.value;renderProducts()"><button class="btn" onclick="productForm()">Add Product</button></div></div><div class="searchbar" style="margin-bottom:12px"><button class="btn ghost" onclick="selectVisibleProducts()">${selected.length===rows.length&&rows.length?"Unselect All":"Select Visible"}</button><select class="field" id="bulkAction"><option value="">Bulk action</option><option value="active">Publish / Active</option><option value="draft">Mark Draft</option><option value="inactive">Mark Inactive</option><option value="featured">Mark Featured</option><option value="bestSeller">Mark Best Seller</option><option value="out">Out of Stock</option><option value="stock">Set Stock Qty</option><option value="category">Change Category</option></select><input class="field" id="bulkValue" placeholder="Stock qty / category"><button class="btn alt" onclick="applyProductBulkAction()">Apply (${selected.length})</button></div><div class="table-wrap"><table class="table"><thead><tr><th><input type="checkbox" ${rows.length&&selected.length===rows.length?"checked":""} onchange="selectVisibleProducts(this.checked)"></th><th>Image</th><th>Product</th><th>Price</th><th>Stock</th><th>Flags</th><th>Actions</th></tr></thead><tbody>${rows.map(p=>`<tr><td><input type="checkbox" ${state.selectedProducts.has(p.id)?"checked":""} onchange="toggleProductSelect('${p.id}',this.checked)"></td><td>${imageOf(p)?`<img class="thumb" src="${imageOf(p)}">`:"-"}<div class="thumbs-row">${imagesOf(p).slice(1,5).map(src=>`<img src="${src}">`).join("")}</div></td><td><b>${p.name||"-"}</b><div class="muted">${p.category||"General"} - ${p.sku||"No SKU"}</div><div class="muted">${imagesOf(p).length} image${imagesOf(p).length===1?"":"s"}</div></td><td><b>${money(p.discountPrice||p.price)}</b><div class="muted">Old: ${p.oldPrice?money(p.oldPrice):"-"}</div></td><td>${badge(p.stockStatus||"Available")}<div class="muted">Qty: ${p.stockQty||0}</div><div class="muted">Delivery: ${p.deliveryDays||state.settings.deliveryDays||4} days</div></td><td>${p.featured?badge("Featured"):""} ${p.bestSeller?badge("Best Seller"):""} ${p.draft||p.active===false?badge("Draft"):badge("Active")}</td><td><div class="actions"><button class="btn mini ghost" onclick="productForm('${p.id}')">Edit</button><button class="btn mini danger" onclick="removeDoc('products','${p.id}')">Delete</button></div></td></tr>`).join("")||`<tr><td colspan="7">No products yet.</td></tr>`}</tbody></table></div></div>`;
    }
    window.toggleProductSelect=(id,checked)=>{checked?state.selectedProducts.add(id):state.selectedProducts.delete(id);renderProducts()};
    window.selectVisibleProducts=force=>{const rows=state.products.filter(p=>(p.name||"").toLowerCase().includes(state.productSearch.toLowerCase()));const on=typeof force==="boolean"?force:!(rows.length&&rows.every(p=>state.selectedProducts.has(p.id)));rows.forEach(p=>on?state.selectedProducts.add(p.id):state.selectedProducts.delete(p.id));renderProducts()};
    window.applyProductBulkAction=async()=>{const ids=[...state.selectedProducts];if(!ids.length)return toast("Select products first");const action=$("bulkAction").value,value=$("bulkValue").value.trim();if(!action)return toast("Choose bulk action");const data={updatedAt:serverTimestamp()};if(action==="active"){data.active=true;data.draft=false}if(action==="draft"){data.active=false;data.draft=true}if(action==="inactive"){data.active=false;data.draft=true}if(action==="featured")data.featured=true;if(action==="bestSeller")data.bestSeller=true;if(action==="out"){data.stockStatus="Out of Stock";data.stockQty=0}if(action==="stock"){const qty=Number(value);if(Number.isNaN(qty))return toast("Stock qty number me dalo");data.stockQty=qty;data.stockStatus=qty>0?"Available":"Out of Stock"}if(action==="category"){if(!value)return toast("Category name dalo");data.category=value}await Promise.all(ids.map(id=>updateDoc(doc(db,"products",id),data).catch(console.warn)));await logAdminAction("bulkProductUpdate",ids.join(","),{action,value,count:ids.length});state.selectedProducts.clear();toast("Bulk update done");loadData()};

    async function saveSettings(e){e.preventDefault();const f=e.target;try{const logo=f.logoFile.files[0]?await uploadCloudinary(f.logoFile.files[0]):val(f,"logo");const upiQr=f.upiQrFile.files[0]?await uploadCloudinary(f.upiQrFile.files[0]):val(f,"upiQr");const data={storeName:val(f,"storeName"),logo,whatsapp:val(f,"whatsapp"),upiId:val(f,"upiId"),upiQr,deliveryCharge:Number(val(f,"deliveryCharge")||0),freeDeliveryAbove:Number(val(f,"freeDeliveryAbove")||0),deliveryDays:Number(val(f,"deliveryDays")||4),codEnabled:bool(f,"codEnabled"),announcement:val(f,"announcement"),contactEmail:val(f,"contactEmail"),storeAddress:val(f,"storeAddress"),returnPolicy:val(f,"returnPolicy"),shippingPolicy:val(f,"shippingPolicy"),privacyPolicy:val(f,"privacyPolicy"),aboutStore:val(f,"aboutStore"),updatedAt:serverTimestamp()};await setDoc(doc(db,"settings","store"),data,{merge:true});toast("Settings saved");loadData()}catch(err){console.error(err);toast("Settings save failed")}}

    function renderCoupons(){$("coupons").innerHTML=`<div class="panel"><div class="panel-head"><h2>Coupon System</h2><button class="btn" onclick="couponForm()">Add Coupon</button></div><table class="table"><thead><tr><th>Code</th><th>Discount</th><th>Limits</th><th>Status</th><th>Actions</th></tr></thead><tbody>${state.coupons.map(c=>`<tr><td><b>${c.code}</b></td><td>${c.discountType} ${c.discountValue}</td><td>Min ${money(c.minimumOrder||0)} Max ${c.maximumDiscount?money(c.maximumDiscount):"-"}<div class="muted">Expiry: ${c.expiryDate||"-"}</div></td><td>${c.active===false?badge("Inactive"):badge("Active")}</td><td><button class="btn mini ghost" onclick="couponForm('${c.id}')">Edit</button> <button class="btn mini danger" onclick="removeDoc('coupons','${c.id}')">Delete</button></td></tr>`).join("")||`<tr><td colspan="5">No coupons yet.</td></tr>`}</tbody></table></div>`}
    window.couponForm=id=>{const c=state.coupons.find(x=>x.id===id)||{active:true,discountType:"percentage"};$("modalTitle").textContent=id?"Edit Coupon":"Add Coupon";$("modalBody").innerHTML=`<form id="couponForm" class="formgrid"><div><label>Code</label><input required class="field" name="code" value="${c.code||""}"></div><div><label>Discount Type</label><select class="field" name="discountType"><option ${c.discountType==="percentage"?"selected":""} value="percentage">Percentage</option><option ${c.discountType==="flat"?"selected":""} value="flat">Flat</option></select></div><div><label>Discount Value</label><input required class="field" type="number" name="discountValue" value="${c.discountValue||""}"></div><div><label>Minimum Order</label><input class="field" type="number" name="minimumOrder" value="${c.minimumOrder||0}"></div><div><label>Maximum Discount</label><input class="field" type="number" name="maximumDiscount" value="${c.maximumDiscount||0}"></div><div><label>Expiry Date</label><input class="field" type="date" name="expiryDate" value="${c.expiryDate||""}"></div><label class="full"><input type="checkbox" name="active" ${c.active!==false?"checked":""}> Active</label><button class="btn full">Save Coupon</button></form>`;$("modal").classList.add("open");$("couponForm").onsubmit=async e=>{e.preventDefault();const data={code:val(e.target,"code").toUpperCase(),discountType:val(e.target,"discountType"),discountValue:Number(val(e.target,"discountValue")||0),minimumOrder:Number(val(e.target,"minimumOrder")||0),maximumDiscount:Number(val(e.target,"maximumDiscount")||0),expiryDate:val(e.target,"expiryDate"),active:bool(e.target,"active"),updatedAt:serverTimestamp()};id?await updateDoc(doc(db,"coupons",id),data):await addDoc(collection(db,"coupons"),{...data,createdAt:serverTimestamp()});closeModal();loadData();toast("Coupon saved")}};
    window.removeDoc=async(coll,id)=>{if(!confirm("Delete this item?"))return;await deleteDoc(doc(db,coll,id));toast("Deleted");loadData()};
  </script>
</body>
